onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "agent"], ["tab"]]

[keys]
# Caps Lock is the real prefix: a Ghostty-scoped Karabiner chord emits ctrl+b, so
# this must stay pinned even though it matches the default.
prefix = "ctrl+b"

# Every [[keys.command]] runs through `herdr-keys run KEY --`, which logs the press
# for `herdr-keys stats`. A binding added without the wrapper still works, uncounted.

[theme]
name = "solarized"
auto_switch = false

[ui.toast]
delivery = "off"

# space-scope plugin — flip the Agents panel between this space and all spaces.
# Revert by deleting this block and reloading (`herdr server reload-config`).

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+shift+s -- ~/.local/bin/herdr-space-scope toggle"

# herdr-dash plugin — floating dashboard: agents, memory by pane, notes,
# prefix cheat-sheet, MEMORY.md index health. Popup is not reachable from the
# CLI, so this shells out to a socket call. Revert by deleting this block and
# reloading (`herdr server reload-config`), not with `config reset-keys`.

[[keys.command]]
key = "prefix+m"           # dashboard popup
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+m -- ~/.local/share/herdr-plugins/herdr-dash/run popup"

# A "dash" tab of three dash panes; focuses it if one exists in any space.
[[keys.command]]
key = "prefix+shift+m"     # dashboard split tab
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+shift+m -- ~/.local/share/herdr-plugins/herdr-dash/run split"

# viewer plugin — floating file picker with Markdown/code preview over the
# focused pane's cwd. Revert by deleting this block and reloading
# (`herdr server reload-config`), not with `config reset-keys`.

[[keys.command]]
key = "prefix+shift+v"     # file viewer popup
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+shift+v -- ~/.local/share/herdr-plugins/viewer/view popup"

[[keys.command]]
key = "prefix+y"           # file viewer in copy mode: enter copies contents
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+y -- ~/.local/share/herdr-plugins/viewer/view copy"

# herdr-compose — nvim split under the agent for writing the next prompt;
# <C-s> in nvim sends it. Revert by deleting this block and reloading.

[[keys.command]]
key = "prefix+i"           # open/close compose split
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+i -- ~/.local/bin/herdr-compose toggle"

[[keys.command]]
key = "prefix+shift+k"     # scroll agent up half a page
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+shift+k -- ~/.local/bin/herdr-compose scroll up"

[[keys.command]]
key = "prefix+shift+j"     # scroll agent down half a page
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+shift+j -- ~/.local/bin/herdr-compose scroll down"

# prsessions plugin — PRs the focused session touched and the other sessions behind
# them; enter jumps to a live one or resumes it in a new tab. Revert by deleting
# this block and reloading (`herdr server reload-config`), not with `config reset-keys`.

[[keys.command]]
key = "prefix+t"           # PR sessions popup
type = "shell"
command = "~/.local/bin/herdr-keys run prefix+t -- ~/.local/share/herdr-plugins/prsessions/prs popup"
